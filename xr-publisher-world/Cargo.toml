[package]
name = "xr-publisher-world"
version = "0.1.0"
edition = "2021"
description = "WASM terrain generation and future ECS for XR Publisher"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[features]
# Dormant ECS scaffolding (ecs::component / ecs::entity) — excluded from the
# shipped WASM until the ECS expansion resumes.
ecs-scaffolding = []
